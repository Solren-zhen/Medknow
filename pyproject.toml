[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medknow"
version = "1.0.0"
description = "Teaching Medical AI When Not to Know — uncertainty-aware referral and domain-shift robustness benchmark for chest X-ray classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["medical-ai", "chest-xray", "uncertainty", "referral", "domain-shift", "pytorch", "calibration"]
dependencies = [
    "torch>=2.5.1,<2.6",
    "torchvision>=0.20.1,<0.21",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "gradio>=4.44",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# E501: line length (research code); E402: imports after sys.path setup;
# EXE001: shebang without executable bit — dev happens on Windows (no exec-bit
# model); scripts are invoked via "python xxx.py", so the shebang is documentation only.
ignore = ["E501", "E402", "EXE001"]
