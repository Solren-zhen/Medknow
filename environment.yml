# Conda environment for medknow (matches the manuscript's stack: Python 3.11,
# PyTorch 2.5, CUDA 12.1 on a single RTX 3060 6GB).
name: medknow
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision=0.20.1
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.10
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pillow>=10.0
  - tqdm>=4.66
  - pip
  - pip:
      - -e .
