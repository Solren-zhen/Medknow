# Uncertainty estimation config — MC Dropout with 30 stochastic forward passes
# (batch norm kept in eval mode), plus MSP / entropy / random baselines.
#
# Manuscript values: MC Dropout 30 samples; internal referral 10% -> retained
# error 4.0% -> 1.4%, 25% -> 0.3% with zero missed pneumonia; random referral
# is ineffective; the signal fails on RSNA and NIH.

uncertainty:
  methods: [mc_dropout, msp, entropy, random]
  mc_samples: 30
  dropout_rate: 0.3
  std_threshold: 0.05
  batch_size: 32

referral:
  rates: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  decision_threshold: 0.5
